# Learning environment only — credentials are intentionally simple (root/123456).
# Requires Docker Desktop. If Docker is unavailable, import database/*.sql manually.
#
# Usage:
#   docker compose up -d          # MySQL only
#   docker compose --profile app up -d   # MySQL + backend (optional)

services:
  mysql:
    image: mysql:8.0
    container_name: mall-admin-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: mall_test
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mall_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall-admin-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mall_test
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      MALL_JWT_SECRET: mall-admin-test-jwt-secret-change-me-32bytes!!
      MALL_JWT_EXPIRE_HOURS: 24
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mall_mysql_data:
